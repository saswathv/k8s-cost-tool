<!DOCTYPE html>
<html>
<head>
    <title>K8s Cost Tool</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin: 0; }
        .subtitle { color: #666; margin: 5px 0 20px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #007bff; color: white; }
        tr:hover { background: #f9f9f9; }
        .cost-high { color: #d32f2f; font-weight: bold; font-size: 16px; }
        .total { background: #e3f2fd; padding: 15px; margin-top: 20px; border-radius: 4px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Kubernetes Cost Dashboard</h1>
        <p class="subtitle">Real-time cost breakdown by namespace</p>
        
        <table>
            <thead>
                <tr>
                    <th>Namespace</th>
                    <th>Pod Count</th>
                    <th>Cost/Month ($)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="3">Loading...</td></tr>
            </tbody>
        </table>
        <div id="total" class="total"></div>
    </div>

    <script>
        fetch('/api/costs/by-namespace')
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                let total = 0;
                data.forEach(item => {
                    total += item.cost_per_month;
                    const row = `
                        <tr>
                            <td><strong>${item.namespace}</strong></td>
                            <td>${item.pod_count}</td>
                            <td class="cost-high">$${item.cost_per_month.toFixed(2)}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
                
                document.getElementById('total').innerHTML = `💰 Total Monthly Cost: $${total.toFixed(2)}`;
            })
            .catch(e => {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="3">Error: ${e}</td></tr>`;
            });
    </script>
</body>
</html>
